name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  layering:
    name: layering check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- check-layering

  protocol:
    name: protocol schema compat gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails if the committed docs/protocol/ schema no longer matches the
      # live wire types without PROTOCOL_VERSION being bumped (§4.27, D11).
      - run: cargo run -p xtask -- check-protocol

  deny:
    name: cargo-deny (licenses + advisories)
    # Linux-only: EmbarkStudios/cargo-deny-action is a container action.
    # The check itself is host-independent — deny.toml pins the target
    # triples it evaluates (macOS, Linux, Windows) explicitly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The build plan requires the runtime to be fully functional offline
  # after required components are installed (§47). This job proves the
  # test suite itself makes no network calls once dependencies are
  # fetched, by running with networking disabled.
  offline:
    name: offline test run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo test --workspace --offline

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  msrv:
    name: MSRV build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: read pinned toolchain
        id: pin
        run: echo "version=$(grep channel rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # Phase 11: the offline evaluation suite is a regression gate. Runs the
  # `valyria-bench` fixture tasks against the deterministic fake model and
  # diffs the result against docs/bench/baseline.json — any task that
  # stops passing, or a cost metric that blows up, fails the build.
  bench:
    name: benchmark suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bench

  # Phase 11: property / fuzz gate for the parser surfaces §7 calls out —
  # patch & diff parser, protocol frame decoder, tool-input canonicaliser.
  # A higher case count than the default `cargo test` run.
  property:
    name: property / fuzz tests
    runs-on: macos-latest
    env:
      PROPTEST_CASES: "2048"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo test
          -p valyria-edit --test fuzz_edit
          -p valyria-protocol --test fuzz_protocol
          -p valyria-tools --test fuzz_tool_inputs

  # Phase 11: one aggregate gate — layering + protocol compat + benchmark
  # baseline + the acceptance-mapping doc, with a summary table.
  release-gates:
    name: release gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask release-gates
