[package]
name = "valyria-model-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Download, resume, integrity verification, license surfacing, disk GC."

[package.metadata.valyria]
layer = 4
phase = 9

[features]
default = ["http"]
# The real reqwest + rustls download transport (`HttpFetcher`). On by
# default; `--no-default-features` drops the TLS stack entirely and leaves
# only the offline-testable `InMemoryFetcher`.
http = ["dep:reqwest"]

[dependencies]
valyria-types = { workspace = true }
valyria-util = { workspace = true }
valyria-store = { workspace = true }
valyria-hardware = { workspace = true }
valyria-model-registry = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
valyria-testkit = { workspace = true }
valyria-model = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
