[package]
name = "valyria-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "gix-backed status/diff/log/blame/show/branches/renames/merge state; writes behind permission (§24)."

[package.metadata.valyria]
layer = 1
phase = 1

[dependencies]
valyria-types = { workspace = true }
valyria-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
gix = { workspace = true, features = ["status", "blob-diff"] }
imara-diff = { workspace = true }

[dev-dependencies]
valyria-testkit = { workspace = true }
tempfile = { workspace = true }
