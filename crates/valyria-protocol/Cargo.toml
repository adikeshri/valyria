[package]
name = "valyria-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned wire types, JSON-RPC framing, streaming, schema generation."

[package.metadata.valyria]
layer = 6
phase = 3

[dependencies]
valyria-types = { workspace = true }
valyria-util = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync"] }

[dev-dependencies]
proptest = { workspace = true }
valyria-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
